<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>資料修復工具</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #f5f3ee; }
    h2 { color: #2d6a4f; }
    .box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    button { background: #2d6a4f; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 1rem; cursor: pointer; margin-top: 16px; }
    button:disabled { background: #aaa; cursor: default; }
    #log { margin-top: 20px; font-size: 0.85rem; line-height: 1.8; color: #333; white-space: pre-wrap; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 80px; }
    .ok  { color: #2d6a4f; }
    .err { color: #c0392b; }
    .warn { color: #e67e22; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔧 值班表資料修復工具</h2>
    <p>此工具會將 Firebase 中所有值班資料的日期 key 往後移動 <strong>+1 天</strong>，修正時區偏差問題。</p>
    <p style="color:#c0392b;font-size:0.85rem;">⚠️ 請只執行一次，執行後請關閉此頁面。</p>
    <button id="startBtn">開始修復</button>
    <div id="log">等待執行…</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiizhZh6A3-CgD4RBkz9h7hapLruGKYdM",
  authDomain: "sjps-dutyschedule.firebaseapp.com",
  projectId: "sjps-dutyschedule",
  storageBucket: "sjps-dutyschedule.firebasestorage.app",
  messagingSenderId: "550906925883",
  appId: "1:550906925883:web:241201f262f37470e65d1e",
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const logEl = document.getElementById('log');
const btn   = document.getElementById('startBtn');

function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
}

function shiftDateKey(key) {
  // key format: "2026-07-05__academic"
  const [datePart, deptPart] = key.split('__');
  if (!datePart || !deptPart) return null;
  const [y, m, d] = datePart.split('-').map(Number);
  const dt = new Date(y, m - 1, d + 1); // +1 day, local time
  const newDate = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  return `${newDate}__${deptPart}`;
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  logEl.innerHTML = '';
  log('🔍 讀取 Firebase 資料…');

  try {
    const snap = await getDoc(doc(db, 'dutyData/schedule'));
    if (!snap.exists()) {
      log('⚠️ 找不到資料，可能已是空的。', 'warn');
      btn.disabled = false;
      return;
    }

    const data = snap.data();
    const keys = Object.keys(data);
    log(`✅ 找到 ${keys.length} 筆資料`);

    const newData = {};
    let shifted = 0;
    let skipped = 0;

    for (const key of keys) {
      const newKey = shiftDateKey(key);
      if (!newKey) {
        log(`⚠️ 跳過無法解析的 key: ${key}`, 'warn');
        skipped++;
        continue;
      }
      if (data[key]) {
        newData[newKey] = data[key];
        log(`  ${key}  →  ${newKey}  (${data[key]})`, 'ok');
        shifted++;
      }
    }

    log(`\n📝 共 ${shifted} 筆需要更新，正在寫入…`);
    await setDoc(doc(db, 'dutyData/schedule'), newData);
    log(`\n🎉 完成！請重新整理值班表頁面確認資料正確。`, 'ok');
    log(`   跳過 ${skipped} 筆無效 key。`, skipped > 0 ? 'warn' : 'ok');

  } catch (e) {
    log(`❌ 錯誤：${e.message}`, 'err');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
